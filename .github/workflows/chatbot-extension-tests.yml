name: CHATBOT extension browser tests
on:
  push:
    branches: [main]
    paths:
      - 'extension/**'
      - '.github/workflows/chatbot-extension-tests.yml'
  workflow_dispatch:

jobs:
  chromium-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test WooTalk restricted mode
        run: python extension/tests/test_wootalk_restricted.py
      - name: Test chatbot modes
        run: python extension/tests/test_chat_modes.py
